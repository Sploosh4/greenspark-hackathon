<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Season Ahead</title><style>body{font-family:Arial,sans-serif;color:#294437;background:#f3f6f1;max-width:390px;padding:35px 25px;margin:8vh auto}h1{font-size:26px;font-weight:500}p{font-size:13px;line-height:1.7;color:#627363}label{display:block;font-size:12px;margin:20px 0}input{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:8px;border:1px solid #cad8c7;border-radius:5px}button{padding:12px 18px;color:white;background:#365b49;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.6}a{color:#365b49}:focus-visible{outline:3px solid #8bb49b;outline-offset:3px}#status{min-height:35px}</style></head><body><p>TEAM CONNECT / Q3</p><h1>Season Ahead</h1><p>Sign in with an approved manager account for this instance.</p><form id="login" method="post" action="/auth/login"><label>Username<input name="username" id="username" autocomplete="username" required></label><label>Password<input type="password" name="password" id="password" autocomplete="current-password" required></label><button id="submit">Sign in</button></form><p id="status" role="status"></p><script>const form=document.querySelector('#login'),status=document.querySelector('#status'),submit=document.querySelector('#submit');form.onsubmit=async event=>{event.preventDefault();submit.disabled=true;status.textContent='Signing in…';try{const challenge=await fetch('/api/auth/challenge',{cache:'no-store',credentials:'same-origin'});if(!challenge.ok)throw Error('Sign-in is not configured for this local preview.');const c=await challenge.json();const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Team-Connect-CSRF':c.csrf_token},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!response.ok)throw Error(response.status===429?'Sign-in is temporarily unavailable. Please wait.':'Unable to sign in. Check your details.');location.assign('/');}catch(error){status.textContent=error.message;}finally{document.querySelector('#password').value='';submit.disabled=false;}};</script></body></html>
