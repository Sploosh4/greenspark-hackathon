<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff"><title>Customer review · Team Connect</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="styles.css">
</head><body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="app-bar"><a class="brand" href="#" id="brand">Team Connect</a><span class="product-label">Customer support</span><span class="demo-label">Synthetic data · 2025 Q1</span></header>
  <div class="workspace">
    <aside class="sidebar"><nav aria-label="Main navigation"><button data-section="review" aria-current="page">Customer review</button><button data-section="planning">Community planning</button></nav><div class="sidebar-footer"><a href="checks.html" target="_blank" rel="noopener">Verification</a><a href="provenance.json" target="_blank" rel="noopener">Data sources</a></div></aside>
    <main>
      <div class="page-heading"><h1 id="page-title">Customer review</h1><div class="page-actions"><button id="back-review" class="text-button" hidden>← Customer review</button><button id="reset" class="secondary">Reset</button></div></div>
      <div id="account-meta" class="account-meta" hidden></div>
      <section class="context" aria-label="Case context">
        <label id="area-control">Area<select id="community"></select></label>
        <label id="customer-control">Customer reference<select id="customer"></select></label>
        <label>As of · 12:00 AWST<input id="date" type="date" min="2025-01-01" max="2025-03-31" value="2025-01-17"></label>
        <label>Weather scenario<select id="event"><option value="HEAT01">January · Pilbara heat</option><option value="CYCLONE01">February · cyclone</option><option value="HEAT02">March · northern heat</option><option value="FLOOD01">March · Kimberley flood</option></select></label>
      </section>
      <nav class="tabs" aria-label="Customer details" hidden><button data-view="overview">Overview</button><button data-view="credit">Financial pressure</button><button data-view="needs">Disclosed needs</button><button data-view="arrangements">Arrangements</button><button data-view="journey">Support journey</button></nav>
      <div id="notice" role="status"></div><section id="content" aria-live="polite" aria-busy="true"><div class="panel empty">Loading scenario…</div></section>
    </main>
  </div><script src="vendor/maplibre-gl.js"></script><script type="module" src="app.mjs"></script>
</body></html>
